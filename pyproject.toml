[project]
name = "devdash"
version = "0.1.0"
description = "Terminal dashboard for hackathon/dev projects: git status, dev servers, live logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.0"]
keywords = ["tui", "textual", "dashboard", "git", "dev-server", "omarchy", "hyprland"]

[project.urls]
Homepage = "https://github.com/wahidpatel05/devdash"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
devdash = "devdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devdash"]
